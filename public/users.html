<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Family Planning Score Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <div class="bg-light border-end" style="width: 260px; min-height: 100vh;">
            <div class="p-3 border-bottom fw-bold">
                <i class="bi bi-diagram-3"></i> Navigation
            </div>
            <div class="list-group list-group-flush" id="navigationItems">
                <!-- Navigation items will be loaded dynamically based on permissions -->
            </div>
        </div>

        <div class="flex-grow-1">
            <div class="p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="mb-0"><i class="bi bi-people"></i> Users</h3>
                    <button class="btn btn-primary" onclick="openUserModal()"><i class="bi bi-plus"></i> New User</button>
                </div>
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr><th>Name</th><th>Email</th><th>Status</th><th>Created</th><th style="width:140px">Actions</th></tr>
                                </thead>
                                <tbody id="usersBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- User Modal -->
                <div class="modal fade" id="userModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="userModalTitle">New User</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <form id="userForm">
                                    <input type="hidden" id="userId">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Name</label>
                                            <input type="text" id="name" class="form-control" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Email</label>
                                            <input type="email" id="email" class="form-control" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Password</label>
                                            <input type="password" id="password" class="form-control" placeholder="Set/Change password">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Active</label>
                                            <select id="isActive" class="form-select"><option value="true">Active</option><option value="false">Inactive</option></select>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Roles</label>
                                            <div class="row">
                                                <div class="col-5">
                                                    <label class="small text-muted">Available Roles</label>
                                                    <select id="availableRoles" class="form-select" size="5" multiple></select>
                                                </div>
                                                <div class="col-2 d-flex flex-column justify-content-center align-items-center">
                                                    <button type="button" class="btn btn-sm btn-outline-primary mb-2" onclick="addRole()" title="Add selected role">
                                                        <i class="bi bi-arrow-right"></i>
                                                    </button>
                                                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRole()" title="Remove selected role">
                                                        <i class="bi bi-arrow-left"></i>
                                                    </button>
                                                </div>
                                                <div class="col-5">
                                                    <label class="small text-muted">Selected Roles</label>
                                                    <select id="selectedRoles" class="form-select" size="5" multiple></select>
                                                </div>
                                            </div>
                                            <input type="hidden" id="roleIds" name="roleIds">
                                        </div>
                                        <div class="col-md-12">
                                            <label class="form-label">Admin Areas (add multiple)</label>
                                            <div class="row g-2 mb-2">
                                                <div class="col-md-3">
                                                    <select class="form-select form-select-sm" id="areaRegion">
                                                        <option value="">Select Region</option>
                                                    </select>
                                                </div>
                                                <div class="col-md-3">
                                                    <select class="form-select form-select-sm" id="areaDistrict" disabled>
                                                        <option value="">Select District</option>
                                                    </select>
                                                </div>
                                                <div class="col-md-3">
                                                    <select class="form-select form-select-sm" id="areaSubcounty" disabled>
                                                        <option value="">Select Subcounty</option>
                                                    </select>
                                                </div>
                                                <div class="col-md-3">
                                                    <select class="form-select form-select-sm" id="areaFacility" disabled>
                                                        <option value="">Select Facility</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <button class="btn btn-outline-secondary btn-sm" type="button" onclick="addArea()">
                                                <i class="bi bi-plus"></i> Add Area
                                            </button>
                                            <ul class="list-group mt-2" id="areasList"></ul>
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button class="btn btn-primary" onclick="saveUser()">Save</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navigation.js"></script>
    <script>
        const API_BASE = '/api';
        let userModal;
        let currentAreas = [];

        function getAuthHeaders() { return {'Authorization': 'Bearer ' + localStorage.getItem('token'), 'Content-Type': 'application/json'}; }
        function logout() { localStorage.clear(); window.location.href='/'; }

        let isLoadingUsers = false;
        async function loadUsers() {
            // Prevent concurrent calls
            if (isLoadingUsers) {
                return;
            }
            
            isLoadingUsers = true;
            try {
                const resp = await fetch(`${API_BASE}/users`, {headers: getAuthHeaders()});
                const data = await resp.json();
                
                // Deduplicate users by id
                const seenIds = new Set();
                const uniqueUsers = data.filter(u => {
                    if (seenIds.has(u.id)) {
                        return false;
                    }
                    seenIds.add(u.id);
                    return true;
                });
                
                const tbody = document.getElementById('usersBody');
                tbody.innerHTML = uniqueUsers.map(u=>`<tr>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td><span class="badge ${u.isActive ? 'bg-success' : 'bg-secondary'}">${u.isActive?'Active':'Inactive'}</span></td>
                    <td>${new Date(u.createdAt).toLocaleDateString()}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editUser(${u.id})"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${u.id})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>`).join('');
            } finally {
                isLoadingUsers = false;
            }
        }

        async function openUserModal() {
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('userModalTitle').textContent = 'New User';
            currentAreas = [];
            document.getElementById('areasList').innerHTML = '';
            // Clear selected roles
            document.getElementById('selectedRoles').innerHTML = '';
            document.getElementById('roleIds').value = '';
            await loadRolesAndAreas();
            userModal = new bootstrap.Modal(document.getElementById('userModal'));
            userModal.show();
        }

        async function editUser(id) {
            const resp = await fetch(`${API_BASE}/users/${id}`, {headers: getAuthHeaders()});
            const data = await resp.json();
            const u = data.user || data;
            document.getElementById('userId').value = u.id;
            document.getElementById('name').value = u.name;
            document.getElementById('email').value = u.email;
            document.getElementById('isActive').value = u.isActive ? 'true' : 'false';
            await loadRolesAndAreas();
            // Move existing roles to selected list
            if (data.roles && data.roles.length > 0) {
                const available = document.getElementById('availableRoles');
                const selected = document.getElementById('selectedRoles');
                data.roles.forEach(r => {
                    // Find and move from available to selected
                    const opt = Array.from(available.options).find(o => parseInt(o.value) === r.id);
                    if (opt) {
                        const newOpt = document.createElement('option');
                        newOpt.value = opt.value;
                        newOpt.textContent = opt.textContent;
                        newOpt.dataset.name = opt.dataset.name;
                        selected.appendChild(newOpt);
                        opt.remove();
                    }
                });
                updateRoleIds();
            }
            // Set existing admin areas - need to load hierarchy data for display
            currentAreas = (data.adminAreas || []).map(area => ({
                regionId: area.regionId || null,
                districtId: area.districtId || null,
                subcountyId: area.subcountyId || null,
                facilityId: area.facilityId || null
            }));
            
            // Load subcounties and facilities for existing areas if needed
            for (const area of currentAreas) {
                if (area.districtId && !document.getElementById('areaDistrict').querySelector(`option[value="${area.districtId}"]`)) {
                    // Need to load districts for the region
                    const regionId = area.regionId;
                    if (regionId) {
                        const districts = await fetch(`${API_BASE}/districts/${regionId}`, {headers: getAuthHeaders()}).then(r=>r.json());
                        districts.forEach(d => {
                            if (!document.getElementById('areaDistrict').querySelector(`option[value="${d.id}"]`)) {
                                const opt = document.createElement('option');
                                opt.value = d.id;
                                opt.textContent = d.name;
                                document.getElementById('areaDistrict').appendChild(opt);
                            }
                        });
                    }
                }
                if (area.subcountyId && !document.getElementById('areaSubcounty').querySelector(`option[value="${area.subcountyId}"]`)) {
                    // Need to load subcounties for the district
                    const districtId = area.districtId;
                    if (districtId) {
                        const subcounties = await fetch(`${API_BASE}/subcounties/${districtId}`, {headers: getAuthHeaders()}).then(r=>r.json());
                        subcounties.forEach(s => {
                            if (!document.getElementById('areaSubcounty').querySelector(`option[value="${s.id}"]`)) {
                                const opt = document.createElement('option');
                                opt.value = s.id;
                                opt.textContent = s.name;
                                document.getElementById('areaSubcounty').appendChild(opt);
                            }
                        });
                    }
                }
                if (area.facilityId && !document.getElementById('areaFacility').querySelector(`option[value="${area.facilityId}"]`)) {
                    // Need to load facilities for the subcounty
                    const subcountyId = area.subcountyId;
                    if (subcountyId) {
                        const facilities = await fetch(`${API_BASE}/facilities/${subcountyId}`, {headers: getAuthHeaders()}).then(r=>r.json());
                        facilities.forEach(f => {
                            if (!document.getElementById('areaFacility').querySelector(`option[value="${f.id}"]`)) {
                                const opt = document.createElement('option');
                                opt.value = f.id;
                                opt.textContent = f.name;
                                document.getElementById('areaFacility').appendChild(opt);
                            }
                        });
                    }
                }
            }
            
            updateAreasList();
            userModal = new bootstrap.Modal(document.getElementById('userModal'));
            userModal.show();
        }

        async function loadRolesAndAreas() {
            const [roles, regions] = await Promise.all([
                fetch(`${API_BASE}/roles`, {headers: getAuthHeaders()}).then(r=>r.json()),
                fetch(`${API_BASE}/regions`, {headers: getAuthHeaders()}).then(r=>r.json())
            ]);
            // Clear and populate available roles
            const availableRoles = document.getElementById('availableRoles');
            const selectedRoles = document.getElementById('selectedRoles');
            availableRoles.innerHTML = '';
            selectedRoles.innerHTML = '';
            roles.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.id;
                opt.textContent = r.name;
                opt.dataset.name = r.name;
                availableRoles.appendChild(opt);
            });
            // Populate regions
            const regionSelect = document.getElementById('areaRegion');
            regionSelect.innerHTML = '<option value="">Region</option>';
            regions.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.id;
                opt.textContent = r.name;
                regionSelect.appendChild(opt);
            });
        }

        function addRole() {
            const available = document.getElementById('availableRoles');
            const selected = document.getElementById('selectedRoles');
            const selectedOptions = Array.from(available.selectedOptions);
            selectedOptions.forEach(opt => {
                // Check if not already in selected
                const exists = Array.from(selected.options).some(o => o.value === opt.value);
                if (!exists) {
                    const newOpt = document.createElement('option');
                    newOpt.value = opt.value;
                    newOpt.textContent = opt.textContent;
                    newOpt.dataset.name = opt.dataset.name;
                    selected.appendChild(newOpt);
                }
                opt.remove();
            });
            updateRoleIds();
        }

        function removeRole() {
            const available = document.getElementById('availableRoles');
            const selected = document.getElementById('selectedRoles');
            const selectedOptions = Array.from(selected.selectedOptions);
            selectedOptions.forEach(opt => {
                const newOpt = document.createElement('option');
                newOpt.value = opt.value;
                newOpt.textContent = opt.textContent;
                newOpt.dataset.name = opt.dataset.name;
                available.appendChild(newOpt);
                opt.remove();
            });
            updateRoleIds();
        }

        function updateRoleIds() {
            const selected = document.getElementById('selectedRoles');
            const roleIds = Array.from(selected.options).map(o => parseInt(o.value));
            document.getElementById('roleIds').value = roleIds.join(',');
        }

        // Setup cascading dropdowns for admin areas
        document.getElementById('areaRegion').addEventListener('change', async function(){
            const regionId = this.value;
            const districtSel = document.getElementById('areaDistrict');
            const subcountySel = document.getElementById('areaSubcounty');
            const facilitySel = document.getElementById('areaFacility');
            
            if (!regionId) {
                districtSel.innerHTML = '<option value="">Select District</option>';
                districtSel.disabled = true;
                subcountySel.innerHTML = '<option value="">Select Subcounty</option>';
                subcountySel.disabled = true;
                facilitySel.innerHTML = '<option value="">Select Facility</option>';
                facilitySel.disabled = true;
                return;
            }
            
            const districts = await fetch(`${API_BASE}/districts/${regionId}`, {headers: getAuthHeaders()}).then(r=>r.json());
            districtSel.innerHTML = '<option value="">Select District</option>';
            districts.forEach(d => {
                const o = document.createElement('option');
                o.value = d.id;
                o.textContent = d.name;
                districtSel.appendChild(o);
            });
            districtSel.disabled = false;
            
            // Reset child dropdowns
            subcountySel.innerHTML = '<option value="">Select Subcounty</option>';
            subcountySel.disabled = true;
            facilitySel.innerHTML = '<option value="">Select Facility</option>';
            facilitySel.disabled = true;
        });

        document.getElementById('areaDistrict').addEventListener('change', async function(){
            const districtId = this.value;
            const subcountySel = document.getElementById('areaSubcounty');
            const facilitySel = document.getElementById('areaFacility');
            
            if (!districtId) {
                subcountySel.innerHTML = '<option value="">Select Subcounty</option>';
                subcountySel.disabled = true;
                facilitySel.innerHTML = '<option value="">Select Facility</option>';
                facilitySel.disabled = true;
                return;
            }
            
            const subcounties = await fetch(`${API_BASE}/subcounties/${districtId}`, {headers: getAuthHeaders()}).then(r=>r.json());
            subcountySel.innerHTML = '<option value="">Select Subcounty</option>';
            subcounties.forEach(s => {
                const o = document.createElement('option');
                o.value = s.id;
                o.textContent = s.name;
                subcountySel.appendChild(o);
            });
            subcountySel.disabled = false;
            
            // Reset facility dropdown
            facilitySel.innerHTML = '<option value="">Select Facility</option>';
            facilitySel.disabled = true;
        });

        document.getElementById('areaSubcounty').addEventListener('change', async function(){
            const subcountyId = this.value;
            const facilitySel = document.getElementById('areaFacility');
            
            if (!subcountyId) {
                facilitySel.innerHTML = '<option value="">Select Facility</option>';
                facilitySel.disabled = true;
                return;
            }
            
            const facilities = await fetch(`${API_BASE}/facilities/${subcountyId}`, {headers: getAuthHeaders()}).then(r=>r.json());
            facilitySel.innerHTML = '<option value="">Select Facility</option>';
            facilities.forEach(f => {
                const o = document.createElement('option');
                o.value = f.id;
                o.textContent = f.name;
                facilitySel.appendChild(o);
            });
            facilitySel.disabled = false;
        });

        function updateAreasList() {
            const areasList = document.getElementById('areasList');
            areasList.innerHTML = '';
            currentAreas.forEach((area, idx) => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';
                let text = '';
                if (area.facilityId) {
                    const fOpt = document.getElementById('areaFacility').querySelector(`option[value="${area.facilityId}"]`);
                    text = fOpt ? fOpt.textContent : `Facility ${area.facilityId}`;
                } else if (area.subcountyId) {
                    const sOpt = document.getElementById('areaSubcounty').querySelector(`option[value="${area.subcountyId}"]`);
                    text = sOpt ? sOpt.textContent : `Subcounty ${area.subcountyId}`;
                } else if (area.districtId) {
                    const dOpt = document.getElementById('areaDistrict').querySelector(`option[value="${area.districtId}"]`);
                    text = dOpt ? dOpt.textContent : `District ${area.districtId}`;
                } else if (area.regionId) {
                    const rOpt = document.getElementById('areaRegion').querySelector(`option[value="${area.regionId}"]`);
                    text = rOpt ? rOpt.textContent : `Region ${area.regionId}`;
                }
                li.textContent = text || 'Area';
                const btn = document.createElement('button');
                btn.className = 'btn btn-sm btn-outline-danger';
                btn.textContent = 'Remove';
                btn.onclick = () => {
                    currentAreas.splice(idx, 1);
                    updateAreasList();
                };
                li.appendChild(btn);
                areasList.appendChild(li);
            });
        }

        function addArea() {
            const r = document.getElementById('areaRegion').value;
            const d = document.getElementById('areaDistrict').value;
            const s = document.getElementById('areaSubcounty').value;
            const f = document.getElementById('areaFacility').value;
            
            // Must have at least one level selected
            if (!r && !d && !s && !f) {
                alert('Please select at least one administrative area');
                return;
            }
            
            // Determine the highest level selected
            const area = {
                regionId: r ? parseInt(r) : null,
                districtId: d ? parseInt(d) : null,
                subcountyId: s ? parseInt(s) : null,
                facilityId: f ? parseInt(f) : null
            };
            
            // Only keep the highest level - if facility is selected, only keep facility
            // If subcounty is selected, only keep subcounty and above, etc.
            if (area.facilityId) {
                // Facility level - keep all hierarchy
            } else if (area.subcountyId) {
                // Subcounty level - remove facility
                area.facilityId = null;
            } else if (area.districtId) {
                // District level - remove subcounty and facility
                area.subcountyId = null;
                area.facilityId = null;
            } else if (area.regionId) {
                // Region level - remove district, subcounty, and facility
                area.districtId = null;
                area.subcountyId = null;
                area.facilityId = null;
            }
            
            currentAreas.push(area);
            updateAreasList();
            
            // Reset dropdowns
            document.getElementById('areaRegion').value = '';
            document.getElementById('areaDistrict').innerHTML = '<option value="">Select District</option>';
            document.getElementById('areaDistrict').disabled = true;
            document.getElementById('areaSubcounty').innerHTML = '<option value="">Select Subcounty</option>';
            document.getElementById('areaSubcounty').disabled = true;
            document.getElementById('areaFacility').innerHTML = '<option value="">Select Facility</option>';
            document.getElementById('areaFacility').disabled = true;
        }

        async function saveUser() {
            const roleIdsValue = document.getElementById('roleIds').value;
            const roleIds = roleIdsValue ? roleIdsValue.split(',').map(id => parseInt(id.trim())).filter(id => !isNaN(id)) : [];
            
            // Format admin areas to match backend expectations
            const adminAreas = currentAreas.map(area => ({
                regionId: area.regionId || null,
                districtId: area.districtId || null,
                subcountyId: area.subcountyId || null,
                facilityId: area.facilityId || null
            }));
            
            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                isActive: document.getElementById('isActive').value === 'true',
                roleIds: roleIds,
                adminAreas: adminAreas
            };
            
            console.log('Saving user with payload:', JSON.stringify(payload, null, 2));
            
            const id = document.getElementById('userId').value;
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE}/users/${id}` : `${API_BASE}/users`;
            const resp = await fetch(url, {method, headers: getAuthHeaders(), body: JSON.stringify(payload)});
            if (!resp.ok) {
                const errorText = await resp.text();
                console.error('Save failed:', errorText);
                alert('Save failed: ' + errorText);
                return;
            }
            bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
            loadUsers();
        }

        async function deleteUser(id) {
            if (!confirm('Delete this user?')) return;
            const resp = await fetch(`${API_BASE}/users/${id}`, {method:'DELETE', headers: getAuthHeaders()});
            if (!resp.ok) { alert('Delete failed'); return; }
            loadUsers();
        }

        loadUsers();
    </script>
</body>
</html>
