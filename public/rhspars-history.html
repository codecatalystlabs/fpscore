<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH SPARS History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="moh-theme.css" rel="stylesheet">
</head>
<body class="moh-body" data-nav-tool="rhspars">
    <header class="moh-topbar">
        <a class="moh-brand" href="tools.html">
            <div class="moh-brand-mark"><i class="bi bi-shield-check"></i></div>
            <div class="moh-brand-text">
                <div class="eyebrow">RH SPARS</div>
                <div class="title">Visit history</div>
            </div>
        </a>
        <div class="moh-topbar-actions">
            <a class="moh-btn moh-btn-primary" href="rhspars-home.html"><i class="bi bi-plus"></i> New visit</a>
        </div>
    </header>
    <div class="moh-layout">
        <aside class="moh-sidebar">
            <div class="nav-heading">Navigation</div>
            <div id="navigationItems"></div>
        </aside>
        <main class="moh-main">
            <div class="moh-page-header">
                <div>
                    <h1>RH SPARS history</h1>
                    <p>Previous integrated RH support supervision visits in your admin areas.</p>
                </div>
            </div>
            <div class="moh-card">
                <div id="list">Loading…</div>
            </div>
        </main>
    </div>
    <script src="navigation.js"></script>
    <script src="scoring-utils.js"></script>
    <script>
        if (!localStorage.getItem('token')) window.location.href = '/';
        fetch('/api/rhspars/assessments', { headers: authHeaders() })
            .then(r => r.json())
            .then(rows => {
                if (!rows.length) {
                    document.getElementById('list').textContent = 'No visits recorded yet.';
                    return;
                }
                document.getElementById('list').innerHTML = `
                    <table class="table table-sm table-hover mb-0">
                        <thead><tr>
                            <th>Facility</th><th>Date</th>
                            <th>Mat</th><th>FP</th><th>ANC</th><th>Comm</th><th>HI</th><th>Gen</th>
                            <th>Grand</th><th>Level</th><th></th>
                        </tr></thead>
                        <tbody>
                            ${rows.map(r => {
                                const level = r.performanceLevel || performanceLevelFromPct(Number(r.grandPercentage));
                                return `<tr>
                                <td>${r.facilityName}</td>
                                <td>${(r.supervisionDate || r.createdAt || '').toString().slice(0,10)}</td>
                                <td>${Number(r.maternityPct).toFixed(0)}</td>
                                <td>${Number(r.fpPct).toFixed(0)}</td>
                                <td>${Number(r.ancPct).toFixed(0)}</td>
                                <td>${Number(r.commoditiesPct).toFixed(0)}</td>
                                <td>${Number(r.healthInfoPct).toFixed(0)}</td>
                                <td>${Number(r.generalFacilityPct).toFixed(0)}</td>
                                <td><strong>${Number(r.grandPercentage).toFixed(1)}%</strong></td>
                                <td><span class="badge ${performanceBadgeClass(level)}">${level}</span></td>
                                <td><a href="rhspars-view.html?id=${r.id}">Open</a></td>
                            </tr>`;
                            }).join('')}
                        </tbody>
                    </table>`;
            })
            .catch(() => { document.getElementById('list').textContent = 'Failed to load.'; });
    </script>
</body>
</html>
