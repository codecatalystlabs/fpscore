<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Planning Score Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="moh-theme.css" rel="stylesheet">
    <style>
        .assessment-type-card {
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .assessment-type-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 16px rgba(0,40,20,0.12);
        }
        #healthWorkerDropdown {
            display: none;
        }
        #healthWorkerDropdown.show {
            display: block !important;
        }
        .health-worker-option {
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid #e9ecef;
        }
        .health-worker-option:hover {
            background-color: #f8f9fa;
        }
        .health-worker-option.selected {
            background-color: #006d41;
            color: white;
        }
        .health-worker-option:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body class="moh-body" data-nav-tool="proficiency">
    <header class="moh-topbar">
        <a class="moh-brand" href="tools.html">
            <div class="moh-brand-mark"><i class="bi bi-shield-check"></i></div>
            <div class="moh-brand-text">
                <div class="eyebrow">Proficiency Score Tool</div>
                <div class="title">Ministry of Health</div>
            </div>
        </a>
        <div class="moh-topbar-actions">
            <a class="moh-btn moh-btn-ghost" href="tools.html"><i class="bi bi-grid"></i> All tools</a>
            <button type="button" class="moh-btn moh-btn-ghost" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </div>
    </header>
    <div class="moh-layout">
        <aside class="moh-sidebar">
            <div class="nav-heading">Navigation</div>
            <div id="navigationItems"></div>
        </aside>

        <main class="moh-main">
            <div class="moh-hero">
                <h1 class="h5 mb-1" style="color:var(--moh-green-dark)">Proficiency Assessment Tool for Family Planning Providers</h1>
                <p class="mb-0 small text-muted">Score provider competence on counselling and clinical FP methods.</p>
            </div>

                <!-- Navigation Tabs -->
                <ul class="nav nav-tabs mb-4" id="mainTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="new-tab" data-bs-toggle="tab" data-bs-target="#new" type="button">
                            <i class="bi bi-plus-circle"></i> New Assessment
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="history-tab" data-bs-toggle="tab" data-bs-target="#history" type="button">
                            <i class="bi bi-clock-history"></i> Assessment History
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="mainTabContent">
                    <!-- New Assessment Tab -->
                    <div class="tab-pane fade show active" id="new" role="tabpanel">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Select Health Worker</h5>
                                <form id="healthWorkerForm">
                                    <div class="row mb-3">
                                        <div class="col-md-2">
                                            <label class="form-label">Region</label>
                                            <select class="form-select" id="regionSelect">
                                                <option value="">All Regions</option>
                                            </select>
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">District</label>
                                            <select class="form-select" id="districtSelect" disabled>
                                                <option value="">All Districts</option>
                                            </select>
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">Subcounty</label>
                                            <select class="form-select" id="subcountySelect" disabled>
                                                <option value="">All Subcounties</option>
                                            </select>
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">Facility</label>
                                            <select class="form-select" id="facilitySelect" disabled>
                                                <option value="">All Facilities</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">Health Worker <span class="text-danger">*</span></label>
                                            <div class="position-relative">
                                                <input type="text" class="form-control" id="healthWorkerSearch" placeholder="Type to search health workers..." autocomplete="off">
                                                <select class="form-select" id="healthWorkerSelect" required style="display: none;">
                                                    <option value="">Select Health Worker...</option>
                                                </select>
                                                <div id="healthWorkerDropdown" class="position-absolute w-100 bg-white border rounded shadow-lg" style="max-height: 300px; overflow-y: auto; z-index: 1000; display: none; top: 100%; margin-top: 2px;">
                                                    <!-- Options will be populated here -->
                                                </div>
                                            </div>
                                            <small class="text-muted">Start typing to search</small>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Select Assessment Type</h5>
                                <div class="row" id="assessmentTypesContainer">
                                    <!-- Assessment types will be loaded here -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Assessment History Tab -->
                    <div class="tab-pane fade" id="history" role="tabpanel">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Health Workers with Assessments</h5>
                                <div class="row mb-3">
                                    <div class="col-md-4">
                                        <label class="form-label">Start Date</label>
                                        <input type="date" class="form-control" id="startDate">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">End Date</label>
                                        <input type="date" class="form-control" id="endDate">
                                    </div>
                                    <div class="col-md-4 d-flex align-items-end">
                                        <button class="btn btn-primary" id="filterAssessments">
                                            <i class="bi bi-funnel"></i> Filter
                                        </button>
                                        <button class="btn btn-secondary ms-2" id="clearFilters">
                                            <i class="bi bi-x-circle"></i> Clear
                                        </button>
                                    </div>
                                </div>
                                <div id="assessmentsList">
                                    <div class="text-center py-5">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
        </main>
    </div>

    <script src="event-logger.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navigation.js"></script>
    <script src="app.js"></script>
    <script src="admin-restrictions.js"></script>
    <script>
        // Check auth on page load
        if (!localStorage.getItem('token')) {
            window.location.href = '/';
        }
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }
        // Add auth header to all fetch requests
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
            const token = localStorage.getItem('token');
            if (token && args[0].startsWith('/api/') && !args[0].includes('/auth/')) {
                if (!args[1]) args[1] = {};
                if (!args[1].headers) args[1].headers = {};
                args[1].headers['Authorization'] = 'Bearer ' + token;
            }
            return originalFetch.apply(this, args);
        };
    </script>
</body>
</html>
