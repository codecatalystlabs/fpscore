<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Form - Family Planning Score Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .header-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 0;
            margin-bottom: 2rem;
        }
        .accordion-button {
            font-weight: 600;
        }
        .accordion-button:not(.collapsed) {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .question-item {
            padding: 1rem;
            border-bottom: 1px solid #e9ecef;
        }
        .question-item:last-child {
            border-bottom: none;
        }
        .response-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .response-btn {
            min-width: 80px;
        }
        .response-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
        }
        .score-badge {
            font-size: 0.85rem;
            padding: 0.25rem 0.5rem;
        }
        .critical-badge {
            background-color: #dc3545;
            color: white;
        }
        .important-badge {
            background-color: #ffc107;
            color: #000;
        }
        .normal-badge {
            background-color: #6c757d;
            color: white;
        }
        .info-section {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        .progress-section {
            position: sticky;
            top: 20px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="header-section">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h4 class="mb-0">
                        <i class="bi bi-clipboard-check"></i> Assessment Form
                    </h4>
                    <small id="assessmentTypeName"></small>
                </div>
                <a href="index.html" class="btn btn-light btn-sm">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-lg-9">
                <!-- Assessment Info -->
                <div class="info-section">
                    <div class="row">
                        <div class="col-md-6">
                            <strong>Facility:</strong> <span id="facilityName"></span>
                        </div>
                        <div class="col-md-6">
                            <strong>Assessment Type:</strong> <span id="assessmentTypeDisplay"></span>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <label class="form-label">Health Worker <span class="text-danger">*</span></label>
                            <select class="form-select form-select-sm" id="healthWorkerSelect" required disabled>
                                <option value="">Loading...</option>
                            </select>
                            <small class="text-muted">Health worker selected from previous page</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Assessor Name</label>
                            <input type="text" class="form-control form-control-sm" id="assessorName">
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-12">
                            <label class="form-label">Notes (Optional)</label>
                            <textarea class="form-control form-control-sm" id="notes" rows="2"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Thematic Areas Accordion -->
                <div class="accordion" id="thematicAreasAccordion">
                    <!-- Thematic areas will be loaded here -->
                </div>

                <!-- Submit Button -->
                <div class="d-grid gap-2 my-4">
                    <button class="btn btn-primary btn-lg" id="submitAssessment">
                        <i class="bi bi-check-circle"></i> Submit Assessment
                    </button>
                </div>
            </div>

            <div class="col-lg-3">
                <div class="card progress-section">
                    <div class="card-body">
                        <h6 class="card-title">Progress</h6>
                        <div class="mb-3">
                            <div class="d-flex justify-content-between mb-1">
                                <small>Overall Score</small>
                                <small id="overallScore">0%</small>
                            </div>
                            <div class="progress" style="height: 20px;">
                                <div class="progress-bar" id="overallProgressBar" role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>
                        <div id="thematicProgress">
                            <!-- Thematic area progress will be shown here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="event-logger.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navigation.js"></script>
    <script src="assessment.js"></script>
</body>
</html>
