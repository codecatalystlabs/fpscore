<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Form - Family Planning Score Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="moh-theme.css" rel="stylesheet">
    <style>
        .accordion-button {
            font-weight: 600;
        }
        .accordion-button:not(.collapsed) {
            background: var(--moh-green-soft);
            color: var(--moh-green-dark);
        }
        .question-item {
            padding: 1rem;
            border-bottom: 1px solid #e9ecef;
        }
        .question-item:last-child {
            border-bottom: none;
        }
        .response-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .response-btn {
            min-width: 80px;
        }
        .response-btn.active {
            background: var(--moh-green);
            border-color: var(--moh-green);
            color: #fff;
        }
        .score-badge {
            font-size: 0.85rem;
            padding: 0.25rem 0.5rem;
        }
        .critical-badge {
            background-color: #dc3545;
            color: white;
        }
        .important-badge {
            background-color: #ffc107;
            color: #000;
        }
        .normal-badge {
            background-color: #6c757d;
            color: white;
        }
        .info-section {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        .progress-section {
            position: sticky;
            top: 20px;
            z-index: 100;
        }
    </style>
</head>
<body class="moh-body" data-nav-tool="proficiency">
    <header class="moh-topbar">
        <a class="moh-brand" href="tools.html">
            <div class="moh-brand-mark"><i class="bi bi-shield-check"></i></div>
            <div class="moh-brand-text">
                <div class="eyebrow">Proficiency Score Tool</div>
                <div class="title">Ministry of Health</div>
            </div>
        </a>
        <div class="moh-topbar-actions">
            <a class="moh-btn moh-btn-ghost" href="tools.html"><i class="bi bi-grid"></i> All tools</a>
            <button type="button" class="moh-btn moh-btn-ghost" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </div>
    </header>
    <div class="moh-layout">
        <aside class="moh-sidebar">
            <div class="nav-heading">Navigation</div>
            <div id="navigationItems"></div>
        </aside>
        <main class="moh-main">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="moh-hero mb-0 flex-grow-1 me-3">
                    <h1 class="h5 mb-1" style="color:var(--moh-green-dark)">
                        <i class="bi bi-clipboard-check"></i> Assessment Form
                    </h1>
                    <p class="mb-0 small text-muted" id="assessmentTypeName"></p>
                </div>
                <a href="home.html" class="moh-btn moh-btn-ghost">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </div>

        <div class="row">
            <div class="col-lg-9">
                <!-- Assessment Info -->
                <div class="info-section">
                    <div class="row">
                        <div class="col-md-6">
                            <strong>Facility:</strong> <span id="facilityName"></span>
                        </div>
                        <div class="col-md-6">
                            <strong>Assessment Type:</strong> <span id="assessmentTypeDisplay"></span>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <label class="form-label">Health Worker <span class="text-danger">*</span></label>
                            <select class="form-select form-select-sm" id="healthWorkerSelect" required disabled>
                                <option value="">Loading...</option>
                            </select>
                            <small class="text-muted">Health worker selected from previous page</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Assessor Name</label>
                            <input type="text" class="form-control form-control-sm" id="assessorName">
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-12">
                            <label class="form-label">Notes (Optional)</label>
                            <textarea class="form-control form-control-sm" id="notes" rows="2"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Thematic Areas Accordion -->
                <div class="accordion" id="thematicAreasAccordion">
                    <!-- Thematic areas will be loaded here -->
                </div>

                <!-- Submit Button -->
                <div class="d-grid gap-2 my-4">
                    <button type="button" class="btn btn-primary btn-lg" id="submitAssessment">
                        <i class="bi bi-check-circle"></i> Submit Assessment
                    </button>
                </div>
            </div>

            <div class="col-lg-3">
                <div class="card progress-section">
                    <div class="card-body">
                        <h6 class="card-title">Progress</h6>
                        <div class="mb-3">
                            <div class="d-flex justify-content-between mb-1">
                                <small>Overall Score</small>
                                <small id="overallScore">0%</small>
                            </div>
                            <div class="progress" style="height: 20px;">
                                <div class="progress-bar" id="overallProgressBar" role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>
                        <div id="thematicProgress">
                            <!-- Thematic area progress will be shown here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </main>
    </div>

    <script src="event-logger.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navigation.js"></script>
    <script src="assessment.js"></script>
</body>
</html>
