<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Ministry of Health RH Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="moh-theme.css" rel="stylesheet">
</head>
<body>
    <div class="moh-login-wrap">
        <div class="moh-login-card">
            <div class="crest"><i class="bi bi-shield-check"></i></div>
            <h1>Ministry of Health</h1>
            <div class="subtitle">Integrated Reproductive Health Tools</div>
            <form id="loginForm" class="text-start">
                <div class="mb-2">
                    <label class="form-label" for="email">Username</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter username" required autocomplete="username">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-group">
                        <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
                        <button class="btn btn-outline-secondary" type="button" id="togglePwd" tabindex="-1"><i class="bi bi-eye"></i></button>
                    </div>
                </div>
                <div id="loginError" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>
                <button type="submit" class="moh-btn moh-btn-primary">Sign in</button>
            </form>
            <p class="text-muted small mt-3 mb-0">Credentials are case sensitive</p>
        </div>
    </div>
    <script src="event-logger.js"></script>
    <script>
        document.getElementById('togglePwd').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');

            if (window.EventLogger) {
                window.EventLogger.log('auth', 'login_attempt', { email, timestamp: new Date().toISOString() });
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    errorDiv.textContent = data.error || 'Login failed';
                    errorDiv.classList.remove('d-none');
                    return;
                }

                const data = await response.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = 'tools.html';
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
