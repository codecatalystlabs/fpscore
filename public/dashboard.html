<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Family Planning Score Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <div class="bg-light border-end" style="width: 260px; min-height: 100vh;">
            <div class="p-3 border-bottom fw-bold">
                <i class="bi bi-diagram-3"></i> Navigation
            </div>
            <div class="list-group list-group-flush" id="navigationItems">
                <!-- Navigation items will be loaded dynamically based on permissions -->
            </div>
        </div>

        <div class="flex-grow-1">
            <div class="p-4">
                <h3 class="mb-4"><i class="bi bi-speedometer2"></i> Dashboard</h3>

                <!-- Filters -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Filters</h5>
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">Region</label>
                                <select class="form-select" id="filterRegion">
                                    <option value="">All Regions</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">District</label>
                                <select class="form-select" id="filterDistrict" disabled>
                                    <option value="">All Districts</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Assessment Type</label>
                                <select class="form-select" id="filterAssessmentType">
                                    <option value="">All Types</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Thematic Area</label>
                                <select class="form-select" id="filterThematicArea" disabled>
                                    <option value="">All Areas</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-3">
                            <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
                            <button class="btn btn-secondary" onclick="clearFilters()">Clear</button>
                        </div>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-3">
                        <div class="card text-bg-primary">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h5 class="card-title mb-1">Assessments</h5>
                                        <div id="metricAssessments" class="fs-4">0</div>
                                    </div>
                                    <i class="bi bi-clipboard2-check fs-1"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-bg-success">
                            <div class="card-body">
                                <h5 class="card-title mb-1">Average Score</h5>
                                <div id="metricAvgScore" class="fs-4">0%</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-bg-warning">
                            <div class="card-body">
                                <h5 class="card-title mb-1">Competent</h5>
                                <div id="metricCompetent" class="fs-4">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-bg-danger">
                            <div class="card-body">
                                <h5 class="card-title mb-1">Not Acceptable</h5>
                                <div id="metricNA" class="fs-4">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <ul class="nav nav-tabs mt-4" id="dashboardTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="overview-tab" data-bs-toggle="tab" data-bs-target="#overviewTab" type="button" role="tab" aria-controls="overviewTab" aria-selected="true">
                            Overview
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="thematic-tab" data-bs-toggle="tab" data-bs-target="#thematicTab" type="button" role="tab" aria-controls="thematicTab" aria-selected="false">
                            Thematic Performance
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="trend-tab" data-bs-toggle="tab" data-bs-target="#trendTab" type="button" role="tab" aria-controls="trendTab" aria-selected="false">
                            Trends
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="level-tab" data-bs-toggle="tab" data-bs-target="#performanceTab" type="button" role="tab" aria-controls="performanceTab" aria-selected="false">
                            Performance Levels
                        </button>
                    </li>
                </ul>

                <div class="tab-content mt-3" id="dashboardTabsContent">
                    <div class="tab-pane fade show active" id="overviewTab" role="tabpanel" aria-labelledby="overview-tab">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Recent Assessments</h5>
                                <div id="recentAssessments"></div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="thematicTab" role="tabpanel" aria-labelledby="thematic-tab">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Average Scores by Assessment Type</h5>
                                <canvas id="thematicChart" height="320"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="trendTab" role="tabpanel" aria-labelledby="trend-tab">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Monthly Assessment Trend</h5>
                                <canvas id="trendChart" height="320"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="performanceTab" role="tabpanel" aria-labelledby="level-tab">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Performance Level Distribution</h5>
                                <canvas id="performanceChart" height="320"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="navigation.js"></script>
    <script>
        const API_BASE = '/api';
        let filters = {};
        const charts = {
            thematic: null,
            trend: null,
            performance: null,
        };

        // Check auth
        if (!localStorage.getItem('token')) {
            window.location.href = '/';
        }

        function getAuthHeaders() {
            return {
                'Authorization': 'Bearer ' + localStorage.getItem('token'),
                'Content-Type': 'application/json'
            };
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }

        async function loadFilters() {
            try {
                const [regions, types] = await Promise.all([
                    fetch(`${API_BASE}/regions`, {headers: getAuthHeaders()}).then(r=>r.json()),
                    fetch(`${API_BASE}/assessment-types`, {headers: getAuthHeaders()}).then(r=>r.json())
                ]);
                regions.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.id;
                    opt.textContent = r.name;
                    document.getElementById('filterRegion').appendChild(opt);
                });
                types.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.id;
                    opt.textContent = t.name;
                    document.getElementById('filterAssessmentType').appendChild(opt);
                });
            } catch (e) {
                console.error('Error loading filters:', e);
            }
        }

        document.getElementById('filterRegion').addEventListener('change', async function() {
            const regionId = this.value;
            const districtSelect = document.getElementById('filterDistrict');
            if (regionId) {
                try {
                    const districts = await fetch(`${API_BASE}/districts/${regionId}`, {headers: getAuthHeaders()}).then(r=>r.json());
                    districtSelect.innerHTML = '<option value="">All Districts</option>';
                    districts.forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d.id;
                        opt.textContent = d.name;
                        districtSelect.appendChild(opt);
                    });
                    districtSelect.disabled = false;
                } catch (e) {}
            } else {
                districtSelect.innerHTML = '<option value="">All Districts</option>';
                districtSelect.disabled = true;
            }
        });

        document.getElementById('filterAssessmentType').addEventListener('change', async function() {
            const typeId = this.value;
            const thematicSelect = document.getElementById('filterThematicArea');
            if (typeId) {
                try {
                    const areas = await fetch(`${API_BASE}/assessment-types/${typeId}/thematic-areas`, {headers: getAuthHeaders()}).then(r=>r.json());
                    thematicSelect.innerHTML = '<option value="">All Areas</option>';
                    areas.forEach(a => {
                        const opt = document.createElement('option');
                        opt.value = a.id;
                        opt.textContent = a.name;
                        thematicSelect.appendChild(opt);
                    });
                    thematicSelect.disabled = false;
                } catch (e) {}
            } else {
                thematicSelect.innerHTML = '<option value="">All Areas</option>';
                thematicSelect.disabled = true;
            }
        });

        function applyFilters() {
            filters = {
                regionId: document.getElementById('filterRegion').value,
                districtId: document.getElementById('filterDistrict').value,
                assessmentTypeId: document.getElementById('filterAssessmentType').value,
                thematicAreaId: document.getElementById('filterThematicArea').value
            };
            loadDashboard();
        }

        function clearFilters() {
            document.getElementById('filterRegion').value = '';
            document.getElementById('filterDistrict').value = '';
            document.getElementById('filterDistrict').disabled = true;
            document.getElementById('filterAssessmentType').value = '';
            document.getElementById('filterThematicArea').value = '';
            document.getElementById('filterThematicArea').disabled = true;
            filters = {};
            loadDashboard();
        }

        async function loadDashboard() {
            try {
                let url = `${API_BASE}/assessments`;
                const params = new URLSearchParams();
                if (filters.regionId) params.append('regionId', filters.regionId);
                if (filters.districtId) params.append('districtId', filters.districtId);
                if (filters.assessmentTypeId) params.append('assessmentTypeId', filters.assessmentTypeId);
                if (filters.thematicAreaId) params.append('thematicAreaId', filters.thematicAreaId);
                if (params.toString()) url += '?' + params.toString();

                const resp = await fetch(url, {headers: getAuthHeaders()});
                if (!resp.ok) throw new Error('Failed to load');
                const data = await resp.json();
                
                document.getElementById('metricAssessments').textContent = data.length;
                if (data.length) {
                    const avg = data.reduce((sum, assessment) => sum + getAssessmentPercentage(assessment), 0) / data.length;
                    document.getElementById('metricAvgScore').textContent = avg.toFixed(1) + '%';
                    document.getElementById('metricCompetent').textContent = data.filter(a => (a.performanceLevel || a.performance_level) === 'Competent').length;
                    document.getElementById('metricNA').textContent = data.filter(a => (a.performanceLevel || a.performance_level) === 'Not Acceptable').length;
                } else {
                    document.getElementById('metricAvgScore').textContent = '0%';
                    document.getElementById('metricCompetent').textContent = '0';
                    document.getElementById('metricNA').textContent = '0';
                }
                const recent = data.slice(0,10).map(a => {
                    const created = a.createdAt || a.created_at;
                    const percentage = a.percentage !== undefined ? a.percentage : (a.percentageScore !== undefined ? a.percentageScore : 0);
                    const level = a.performanceLevel || a.performance_level || 'N/A';
                    const badgeClass = level === 'Proficient' ? 'bg-success' : level === 'Competent' ? 'bg-warning' : 'bg-danger';
                    return `<div class="d-flex justify-content-between border-bottom py-2">
                        <div>${created ? new Date(created).toLocaleString() : 'Unknown date'} - ${a.facilityName || a.facility_name || 'Unknown facility'}</div>
                        <div><strong>${parseFloat(percentage).toFixed(1)}%</strong> <span class="badge ${badgeClass}">${level}</span></div>
                    </div>`;
                }).join('');
                document.getElementById('recentAssessments').innerHTML = recent || '<p class="text-muted">No data</p>';

                updateCharts(data);
            } catch (e) {
                console.error('Error loading dashboard:', e);
            }
        }

        loadFilters();
        loadDashboard();

        function getAssessmentPercentage(assessment) {
            if (assessment.percentage !== undefined && assessment.percentage !== null) {
                return Number(assessment.percentage);
            }
            if (assessment.percentageScore !== undefined && assessment.percentageScore !== null) {
                return Number(assessment.percentageScore);
            }
            return 0;
        }

        function updateCharts(data) {
            const thematicTotals = new Map();
            const levelCounts = {
                Proficient: 0,
                Competent: 0,
                'Not Acceptable': 0,
            };
            const trendTotals = new Map(); // key: YYYY-MM, value: {total, count}

            data.forEach(assessment => {
                const type = assessment.assessmentType || assessment.assessment_type || 'Unknown';
                const percentage = getAssessmentPercentage(assessment);
                const level = assessment.performanceLevel || assessment.performance_level || 'Not Acceptable';
                const created = assessment.createdAt || assessment.created_at;

                if (!thematicTotals.has(type)) {
                    thematicTotals.set(type, { total: 0, count: 0 });
                }
                const thematicStat = thematicTotals.get(type);
                thematicStat.total += percentage;
                thematicStat.count += 1;

                if (levelCounts[level] !== undefined) {
                    levelCounts[level] += 1;
                } else {
                    levelCounts[level] = 1;
                }

                if (created) {
                    const date = new Date(created);
                    if (!isNaN(date.valueOf())) {
                        const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                        if (!trendTotals.has(key)) {
                            trendTotals.set(key, { total: 0, count: 0 });
                        }
                        const trendStat = trendTotals.get(key);
                        trendStat.total += percentage;
                        trendStat.count += 1;
                    }
                }
            });

            const thematicLabels = Array.from(thematicTotals.keys());
            const thematicValues = thematicLabels.map(label => {
                const stat = thematicTotals.get(label);
                return stat.count ? Number((stat.total / stat.count).toFixed(1)) : 0;
            });

            const levelLabels = Object.keys(levelCounts);
            const levelValues = levelLabels.map(label => levelCounts[label]);

            const sortedTrendKeys = Array.from(trendTotals.keys()).sort();
            const trendLabels = sortedTrendKeys.map(key => {
                const [year, month] = key.split('-');
                const date = new Date(Number(year), Number(month) - 1);
                return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short' });
            });
            const trendValues = sortedTrendKeys.map(key => {
                const stat = trendTotals.get(key);
                return stat.count ? Number((stat.total / stat.count).toFixed(1)) : 0;
            });

            renderBarChart('thematicChart', thematicLabels, thematicValues, 'Average Score (%)', 'Average Score by Assessment Type', 'thematic');
            renderLineChart('trendChart', trendLabels, trendValues, 'Average Score (%)', 'Monthly Average Score', 'trend');
            renderDoughnutChart('performanceChart', levelLabels, levelValues, 'Assessments', 'Performance Level Distribution', 'performance');
        }

        function renderBarChart(canvasId, labels, data, yLabel, title, chartKey) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;
            if (charts[chartKey]) {
                charts[chartKey].data.labels = labels;
                charts[chartKey].data.datasets[0].data = data;
                charts[chartKey].update();
                return;
            }
            charts[chartKey] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: yLabel,
                        data,
                        backgroundColor: '#0d6efd',
                    }],
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        title: {
                            display: false,
                            text: title,
                        },
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                        },
                    },
                },
            });
        }

        function renderLineChart(canvasId, labels, data, yLabel, title, chartKey) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;
            if (charts[chartKey]) {
                charts[chartKey].data.labels = labels;
                charts[chartKey].data.datasets[0].data = data;
                charts[chartKey].update();
                return;
            }
            charts[chartKey] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: yLabel,
                        data,
                        fill: false,
                        borderColor: '#198754',
                        tension: 0.3,
                        pointRadius: 4,
                        pointBackgroundColor: '#198754',
                    }],
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        title: {
                            display: false,
                            text: title,
                        },
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                        },
                    },
                },
            });
        }

        function renderDoughnutChart(canvasId, labels, data, legendLabel, title, chartKey) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;
            if (charts[chartKey]) {
                charts[chartKey].data.labels = labels;
                charts[chartKey].data.datasets[0].data = data;
                charts[chartKey].update();
                return;
            }
            charts[chartKey] = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels,
                    datasets: [{
                        label: legendLabel,
                        data,
                        backgroundColor: ['#198754', '#ffc107', '#dc3545'],
                    }],
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                        },
                        title: {
                            display: false,
                            text: title,
                        },
                    },
                },
            });
        }
    </script>
</body>
</html>
