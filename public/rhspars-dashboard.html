<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH SPARS Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="moh-theme.css" rel="stylesheet">
    <style>
        .dash-filters { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: end; }
        .dash-filters .form-select, .dash-filters .form-control { min-width: 150px; font-size: 0.8rem; }
        .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.65rem; margin-bottom: 0.75rem; }
        .kpi {
            background: #fff;
            border: 1px solid var(--moh-border);
            border-radius: 0.55rem;
            padding: 0.75rem 0.85rem;
            box-shadow: var(--moh-card-shadow);
        }
        .kpi .label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--moh-muted); }
        .kpi .value { font-size: 1.45rem; font-weight: 700; color: var(--moh-green-dark); line-height: 1.15; margin-top: 0.15rem; }
        .kpi .hint { font-size: 0.72rem; color: var(--moh-muted); }
        .kpi.alert .value { color: #c0392b; }
        .kpi.warn .value { color: #9a7209; }
        .chart-grid { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 0.75rem; }
        .split { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .insight {
            display: flex; gap: 0.75rem; align-items: center;
            background: var(--moh-green-tint);
            border: 1px solid #cfe3d8;
            border-radius: 0.5rem;
            padding: 0.65rem 0.8rem;
            margin-bottom: 0.75rem;
        }
        .insight strong { color: var(--moh-green-dark); }
        canvas { max-height: 260px; }
        .sheet { max-height: 380px; overflow: auto; }
        .sheet th, .sheet td { white-space: nowrap; font-size: 0.75rem; }
        .heat { display: inline-block; min-width: 3.2rem; text-align: center; border-radius: 0.3rem; padding: 0.1rem 0.35rem; font-weight: 700; }
        @media (max-width: 1100px) {
            .kpi-grid, .chart-grid, .split { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 700px) {
            .kpi-grid, .chart-grid, .split { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="moh-body" data-nav-tool="rhspars">
    <header class="moh-topbar">
        <a class="moh-brand" href="rhspars-home.html">
            <div class="moh-brand-mark"><i class="bi bi-shield-check"></i></div>
            <div class="moh-brand-text">
                <div class="eyebrow">RH SPARS</div>
                <div class="title">Dashboard</div>
            </div>
        </a>
        <div class="moh-topbar-actions">
            <a class="moh-btn moh-btn-ghost" href="rhspars-history.html">History</a>
            <a class="moh-btn moh-btn-primary" href="rhspars-home.html"><i class="bi bi-plus"></i> New visit</a>
        </div>
    </header>
    <div class="moh-layout">
        <aside class="moh-sidebar">
            <div class="nav-heading">Navigation</div>
            <div id="navigationItems"></div>
        </aside>
        <main class="moh-main">
            <div class="moh-page-header">
                <div>
                    <h1>Support supervision</h1>
                    <p>Facility scores across antenatal care, maternity, family planning, commodities, health information, and the general facility.</p>
                </div>
                <div class="dash-filters">
                    <div>
                        <label class="form-label mb-1">Period</label>
                        <select id="filterPeriod" class="form-select form-select-sm">
                            <option value="all" selected>All visits</option>
                            <option value="30">Last 30 days</option>
                            <option value="90">Last 90 days</option>
                            <option value="365">Last 12 months</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label mb-1">Region</label>
                        <select id="filterRegion" class="form-select form-select-sm"><option value="">All regions</option></select>
                    </div>
                    <div>
                        <label class="form-label mb-1">District</label>
                        <select id="filterDistrict" class="form-select form-select-sm"><option value="">All districts</option></select>
                    </div>
                </div>
            </div>
            <div id="dashboard">Loading visits…</div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="navigation.js"></script>
    <script src="scoring-utils.js"></script>
    <script src="rhspars-dashboard.js"></script>
</body>
</html>
