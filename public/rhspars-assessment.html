<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH SPARS — Domain assessment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="moh-theme.css" rel="stylesheet">
    <style>
        .q-row { display:flex; gap:0.75rem; align-items:flex-start; padding:0.45rem 0; border-bottom:1px solid #eef2f0; }
        .q-row:last-child { border-bottom:none; }
        .q-text { flex:1; font-size:0.8rem; line-height:1.35; }
        .resp-btns { display:flex; gap:0.25rem; flex-shrink:0; }
        .resp-btns .btn { padding:0.15rem 0.45rem; font-size:0.72rem; min-width:2.4rem; }
        .resp-btns .btn.active-yes { background:#006d41; border-color:#006d41; color:#fff; }
        .resp-btns .btn.active-no { background:#c0392b; border-color:#c0392b; color:#fff; }
        .resp-btns .btn.active-na { background:#6c757d; border-color:#6c757d; color:#fff; }
        .progress-bar { background:var(--moh-green); }
    </style>
</head>
<body class="moh-body" data-nav-tool="rhspars">
    <header class="moh-topbar">
        <a class="moh-brand" href="rhspars-home.html">
            <div class="moh-brand-mark"><i class="bi bi-shield-check"></i></div>
            <div class="moh-brand-text">
                <div class="eyebrow">RH SPARS</div>
                <div class="title" id="domainTitle">Domain</div>
            </div>
        </a>
        <div class="moh-topbar-actions">
            <span class="moh-badge-soft" id="progressLabel">0%</span>
            <a class="moh-btn moh-btn-ghost" href="rhspars-home.html">Back to domains</a>
            <button type="button" class="moh-btn moh-btn-primary" id="saveBtn"><i class="bi bi-check2"></i> Save & return</button>
        </div>
    </header>

    <div class="moh-layout">
        <aside class="moh-sidebar">
            <div class="nav-heading">Navigation</div>
            <div id="navigationItems"></div>
        </aside>
        <main class="moh-main">
            <div class="moh-hero mb-3">
                <div class="small"><strong id="facilityLabel">Facility</strong> · <span id="visitMeta"></span></div>
                <div class="progress mt-2" style="height:6px"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
                <p class="small text-muted mb-0 mt-2">Yes earns weight · No = 0 · N/A excluded. Domain score = achieved ÷ possible for answered items.</p>
                <div class="mt-2 small"><span id="domainScoreLabel" class="moh-badge-soft">Domain score: —</span></div>
            </div>
            <div id="formRoot">Loading thematic areas…</div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navigation.js"></script>
    <script src="scoring-utils.js"></script>
    <script src="rhspars-assessment.js"></script>
</body>
</html>
