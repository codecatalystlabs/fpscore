<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Trail — Ministry of Health</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="moh-theme.css" rel="stylesheet">
    <style>
        .user-badge {
            background: var(--moh-green-soft);
            color: var(--moh-green-dark);
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .entity-badge {
            background: #e8f1fa;
            color: #1a6bb5;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .action-icon {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.8rem;
        }
        .action-create { color: #006d41; }
        .action-update { color: #c9a227; }
        .action-delete { color: #c0392b; }
        .action-login { color: #0d7a6f; }
        .action-load { color: #1a6bb5; }
        .action-submit { color: #b35c00; }
        #logsTable thead th {
            background: var(--moh-green-tint);
            color: var(--moh-muted);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1px solid var(--moh-border);
            white-space: nowrap;
            padding: 0.5rem 0.65rem;
        }
        #logsTable tbody td {
            font-size: 0.8rem;
            padding: 0.45rem 0.65rem;
            vertical-align: top;
            border-color: #eef2f0;
        }
        #logsTable tbody tr:hover td {
            background: var(--moh-green-soft);
        }
        .pagination .page-link {
            font-size: 0.8rem;
            color: var(--moh-green-dark);
            border-color: var(--moh-border);
            padding: 0.3rem 0.65rem;
        }
        .pagination .page-item.active .page-link {
            background: var(--moh-green);
            border-color: var(--moh-green);
            color: #fff;
        }
        .details-cell {
            max-width: 420px;
            word-break: break-word;
            line-height: 1.35;
        }
    </style>
</head>
<body class="moh-body">
    <header class="moh-topbar">
        <a class="moh-brand" href="tools.html">
            <div class="moh-brand-mark"><i class="bi bi-shield-check"></i></div>
            <div class="moh-brand-text">
                <div class="eyebrow">Audit Trail</div>
                <div class="title">Ministry of Health</div>
            </div>
        </a>
        <div class="moh-topbar-actions">
            <a class="moh-btn moh-btn-ghost" href="tools.html"><i class="bi bi-grid"></i> All tools</a>
            <button type="button" class="moh-btn moh-btn-ghost" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </div>
    </header>

    <div class="moh-layout">
        <aside class="moh-sidebar">
            <div class="nav-heading">Navigation</div>
            <div id="navigationItems"></div>
        </aside>

        <main class="moh-main">
            <div class="moh-page-header">
                <div>
                    <h1>Audit Trail</h1>
                    <p>Review system activity, API calls, and business actions across both tools.</p>
                </div>
                <span class="moh-badge-soft" id="logsBadge">Loading…</span>
            </div>

            <div class="moh-card">
                <h5>Filters</h5>
                <div class="row g-2">
                    <div class="col-md-2">
                        <label class="form-label">User</label>
                        <select id="filterUser" class="form-select">
                            <option value="">All users</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Action</label>
                        <select id="filterEventType" class="form-select">
                            <option value="">All actions</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Entity type</label>
                        <select id="filterCategory" class="form-select">
                            <option value="">All types</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Date from</label>
                        <input type="date" id="filterStartDate" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Date to</label>
                        <input type="date" id="filterEndDate" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Search</label>
                        <input type="text" id="filterSearch" class="form-control" placeholder="Search details…">
                    </div>
                </div>
                <div class="mt-3 d-flex flex-wrap gap-2">
                    <button type="button" class="moh-btn moh-btn-primary" onclick="applyFilters()">
                        <i class="bi bi-search"></i> Apply
                    </button>
                    <button type="button" class="moh-btn moh-btn-ghost" onclick="clearFilters()">
                        <i class="bi bi-x-circle"></i> Reset
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-success" onclick="exportLogs()">
                        <i class="bi bi-download"></i> Export JSON
                    </button>
                </div>
            </div>

            <div class="moh-card">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="mb-0">Activity log</h5>
                    <div id="logsSummary" class="small text-muted"></div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="logsTable">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>User</th>
                                <th>Action</th>
                                <th>Entity</th>
                                <th>ID</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="logsContainer">
                            <tr>
                                <td colspan="6" class="text-center py-4">
                                    <div class="spinner-border spinner-border-sm text-success" role="status"></div>
                                    <span class="ms-2 small text-muted">Loading logs…</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <nav aria-label="Logs pagination" id="paginationNav" class="mt-3" style="display:none">
                    <ul class="pagination pagination-sm justify-content-center mb-0" id="paginationList"></ul>
                </nav>
            </div>
        </main>
    </div>

    <script src="event-logger.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>document.body.setAttribute('data-nav-tool', sessionStorage.getItem('active_tool') || 'proficiency');</script>
    <script src="navigation.js"></script>
    <script>
        const API_BASE = '/api';
        let currentPage = 1;
        let totalPages = 1;

        function getAuthHeaders() {
            const headers = {};
            const token = localStorage.getItem('token');
            if (token) headers['Authorization'] = `Bearer ${token}`;
            return headers;
        }

        function asList(data) {
            return Array.isArray(data) ? data : [];
        }

        if (!localStorage.getItem('token')) {
            window.location.href = '/';
        }

        async function loadFilters() {
            try {
                const usersRes = await fetch(`${API_BASE}/users`, { headers: getAuthHeaders() });
                if (usersRes.ok) {
                    const users = asList(await usersRes.json());
                    const userSelect = document.getElementById('filterUser');
                    users.forEach(user => {
                        const option = document.createElement('option');
                        option.value = user.id;
                        option.textContent = user.name || user.email;
                        userSelect.appendChild(option);
                    });
                }

                const categoriesRes = await fetch(`${API_BASE}/events/categories`, { headers: getAuthHeaders() });
                if (categoriesRes.ok) {
                    const categories = asList(await categoriesRes.json());
                    const categorySelect = document.getElementById('filterCategory');
                    categories.forEach(cat => {
                        const option = document.createElement('option');
                        option.value = cat;
                        option.textContent = String(cat).charAt(0).toUpperCase() + String(cat).slice(1);
                        categorySelect.appendChild(option);
                    });
                }

                const typesRes = await fetch(`${API_BASE}/events/types`, { headers: getAuthHeaders() });
                if (typesRes.ok) {
                    const types = asList(await typesRes.json());
                    const typeSelect = document.getElementById('filterEventType');
                    types.forEach(type => {
                        const option = document.createElement('option');
                        option.value = type;
                        option.textContent = String(type).charAt(0).toUpperCase() + String(type).slice(1);
                        typeSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading filters:', error);
            }
        }

        async function loadLogs(page = 1) {
            currentPage = page;
            const container = document.getElementById('logsContainer');
            container.innerHTML = '<tr><td colspan="6" class="text-center py-4"><div class="spinner-border spinner-border-sm text-success"></div><span class="ms-2 small text-muted">Loading…</span></td></tr>';

            try {
                const params = new URLSearchParams({ page: page, limit: 50 });
                const userId = document.getElementById('filterUser').value;
                const category = document.getElementById('filterCategory').value;
                const eventType = document.getElementById('filterEventType').value;
                const startDate = document.getElementById('filterStartDate').value;
                const endDate = document.getElementById('filterEndDate').value;
                const search = document.getElementById('filterSearch').value;
                if (userId) params.append('userId', userId);
                if (category) params.append('category', category);
                if (eventType) params.append('eventType', eventType);
                if (startDate) params.append('startDate', startDate);
                if (endDate) params.append('endDate', endDate);
                if (search) params.append('search', search);

                const response = await fetch(`${API_BASE}/events?${params.toString()}`, { headers: getAuthHeaders() });
                if (!response.ok) throw new Error('Failed to load logs');

                const data = await response.json();
                totalPages = data.pages || 1;
                const events = asList(data.events);

                if (!events.length) {
                    container.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4 small">No logs match these filters.</td></tr>';
                    document.getElementById('paginationNav').style.display = 'none';
                    document.getElementById('logsSummary').textContent = '';
                    document.getElementById('logsBadge').textContent = '0 entries';
                    return;
                }

                container.innerHTML = '';
                events.forEach(event => container.appendChild(createLogRow(event)));

                const start = (data.page - 1) * data.limit + 1;
                const end = start + events.length - 1;
                document.getElementById('logsSummary').textContent =
                    `Showing ${start.toLocaleString()}–${end.toLocaleString()} of ${(data.total || 0).toLocaleString()}`;
                document.getElementById('logsBadge').textContent =
                    `${(data.total || 0).toLocaleString()} entries`;

                updatePagination(data.page, data.pages, data.total);
            } catch (error) {
                console.error('Error loading logs:', error);
                container.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4 small">${error.message}</td></tr>`;
            }
        }

        function getActionIcon(eventType) {
            const type = (eventType || '').toLowerCase();
            if (type.includes('create')) return '<i class="bi bi-plus-circle action-create"></i>';
            if (type.includes('update') || type.includes('edit')) return '<i class="bi bi-pencil-square action-update"></i>';
            if (type.includes('delete')) return '<i class="bi bi-trash action-delete"></i>';
            if (type.includes('login')) return '<i class="bi bi-box-arrow-in-right action-login"></i>';
            if (type.includes('load')) return '<i class="bi bi-eye action-load"></i>';
            if (type.includes('submit')) return '<i class="bi bi-check-circle action-submit"></i>';
            if (type.includes('request')) return '<i class="bi bi-arrow-up-right action-load"></i>';
            if (type.includes('response')) return '<i class="bi bi-arrow-down-left action-load"></i>';
            return '<i class="bi bi-circle text-muted"></i>';
        }

        function formatDetails(event) {
            if (event.data && event.data.description) {
                let details = event.data.description;
                if (event.data.success === false) {
                    details += `<br><small class="text-danger"><i class="bi bi-x-circle"></i> Failed (Status: ${event.data.status})</small>`;
                }
                return details;
            }
            if (event.page && event.page.includes(' ')) return event.page;
            if (event.data && event.data.method && event.data.url) {
                const duration = event.data.duration_ms ? ` <small class="text-muted">(${event.data.duration_ms}ms)</small>` : '';
                const statusBadge = event.data.success
                    ? `<span class="badge text-bg-success" style="font-size:0.65rem">OK</span>`
                    : `<span class="badge text-bg-danger" style="font-size:0.65rem">Fail</span>`;
                let details = `<strong>${event.data.method}</strong> ${event.data.url} ${statusBadge}${duration}`;
                if (!event.data.success && event.data.error) {
                    details += `<br><small class="text-danger">${event.data.error}</small>`;
                }
                return details;
            }
            return event.page || event.data?.url || event.data?.text || '—';
        }

        function createLogRow(event) {
            const tr = document.createElement('tr');
            const date = new Date(event.createdAt);
            const dateStr = date.toLocaleString('en-GB', {
                day: '2-digit', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
            const userName = event.userName || event.userEmail || 'System';
            const entityType = (event.data && event.data.entity_type) || event.category || '—';
            const entityId = event.id || '—';
            tr.innerHTML = `
                <td class="text-nowrap small text-muted">${dateStr}</td>
                <td><span class="user-badge">${userName}</span></td>
                <td><span class="action-icon">${getActionIcon(event.eventType)} ${event.eventType || ''}</span></td>
                <td><span class="entity-badge">${entityType}</span></td>
                <td class="small text-muted">${entityId}</td>
                <td class="details-cell">${formatDetails(event)}</td>
            `;
            return tr;
        }

        function updatePagination(page, pages) {
            const nav = document.getElementById('paginationNav');
            const list = document.getElementById('paginationList');
            if (pages <= 1) {
                nav.style.display = 'none';
                return;
            }
            nav.style.display = 'block';
            list.innerHTML = '';

            const addItem = (label, target, disabled, active) => {
                const li = document.createElement('li');
                li.className = `page-item${disabled ? ' disabled' : ''}${active ? ' active' : ''}`;
                li.innerHTML = `<a class="page-link" href="#">${label}</a>`;
                if (!disabled && !active) {
                    li.querySelector('a').onclick = (e) => { e.preventDefault(); loadLogs(target); };
                }
                list.appendChild(li);
            };

            addItem('Prev', page - 1, page === 1, false);
            const startPage = Math.max(1, page - 2);
            const endPage = Math.min(pages, page + 2);
            if (startPage > 1) {
                addItem('1', 1, false, false);
                if (startPage > 2) addItem('…', page, true, false);
            }
            for (let i = startPage; i <= endPage; i++) addItem(String(i), i, false, i === page);
            if (endPage < pages) {
                if (endPage < pages - 1) addItem('…', page, true, false);
                addItem(String(pages), pages, false, false);
            }
            addItem('Next', page + 1, page === pages, false);
        }

        function applyFilters() { loadLogs(1); }

        function clearFilters() {
            document.getElementById('filterUser').value = '';
            document.getElementById('filterCategory').value = '';
            document.getElementById('filterEventType').value = '';
            document.getElementById('filterStartDate').value = '';
            document.getElementById('filterEndDate').value = '';
            document.getElementById('filterSearch').value = '';
            loadLogs(1);
        }

        async function exportLogs() {
            try {
                const params = new URLSearchParams({ page: 1, limit: 10000 });
                const userId = document.getElementById('filterUser').value;
                const category = document.getElementById('filterCategory').value;
                const eventType = document.getElementById('filterEventType').value;
                const startDate = document.getElementById('filterStartDate').value;
                const endDate = document.getElementById('filterEndDate').value;
                const search = document.getElementById('filterSearch').value;
                if (userId) params.append('userId', userId);
                if (category) params.append('category', category);
                if (eventType) params.append('eventType', eventType);
                if (startDate) params.append('startDate', startDate);
                if (endDate) params.append('endDate', endDate);
                if (search) params.append('search', search);

                const response = await fetch(`${API_BASE}/events?${params.toString()}`, { headers: getAuthHeaders() });
                if (!response.ok) throw new Error('Failed to export logs');
                const data = await response.json();
                const blob = new Blob([JSON.stringify(data.events || [], null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `logs_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                alert('Error exporting logs: ' + error.message);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadFilters();
            loadLogs(1);
            document.getElementById('filterSearch').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') applyFilters();
            });
        });
    </script>
</body>
</html>
